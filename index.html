<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลงทะเบียนสมาชิก</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 40px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      text-align: center;
      width: 85%;
      max-width: 350px;
    }
    .icon {
      font-size: 60px;
      margin-bottom: 15px;
      animation: pop 0.3s ease-out forwards;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .success { color: #00B900; } /* สีเขียว LINE */
    .exist { color: #F5A623; }   /* สีส้มเตือน */
    .error { color: #FF3B30; }   /* สีแดงพัง */
    
    h3 { margin: 0 0 10px 0; color: #111; font-size: 22px; }
    p { color: #666; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
    
    .btn-close {
      background-color: #00B900;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      display: none; /* ซ่อนไว้ก่อนจนกว่าจะโหลดเสร็จ */
      transition: background 0.2s;
    }
    .btn-close:active { background-color: #009900; }
    
    /* อนิเมชันโหลดข้อมูล */
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00B900;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div id="icon-container">
      <div class="spinner"></div>
    </div>
    <h3 id="status-title">กำลังเตรียมระบบ...</h3>
    <p id="status-desc">กรุณารอสักครู่</p>
    <button class="btn-close" id="btn-close" onclick="liff.closeWindow()">ปิดหน้าต่าง</button>
  </div>

<script>
const LIFF_ID = "2010292739-3B9N5VGJ";

// ⚠️ นำลิงก์จาก Google Apps Script อันใหม่มาวางที่นี่
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypmL4jgbMixd6KOf2yQ6clGAlML7RanI54JuyIFAWvlUbnvGf7v7GeyVhjQINPk-dU/exec"; 

async function main() {
  // ฟังก์ชันช่วยเปลี่ยนหน้าจอแบบด่วน
  const updateUI = (iconHtml, title, desc, showBtn = false) => {
    document.getElementById("icon-container").innerHTML = iconHtml;
    document.getElementById("status-title").innerText = title;
    document.getElementById("status-desc").innerText = desc;
    if(showBtn) document.getElementById("btn-close").style.display = "block";
  };

  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    updateUI('<div class="spinner"></div>', "กำลังลงทะเบียน...", "ระบบกำลังบันทึกข้อมูลของคุณ");
    
    const profile = await liff.getProfile();
    const formData = new URLSearchParams();
    formData.append("userId", profile.userId);
    formData.append("displayName", profile.displayName);

    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: formData
    });

    const resultText = await res.text();

    // เช็กคำตอบจาก Google Script ว่าเป็นคนใหม่หรือคนเก่า
    if (resultText === "EXIST") {
      updateUI('<div class="icon exist">⚠️</div>', "เคยลงทะเบียนแล้ว", "ระบบพบข้อมูลของคุณในฐานข้อมูลเรียบร้อยแล้ว ไม่ต้องลงทะเบียนซ้ำครับ", true);
    } else if (resultText === "SUCCESS") {
      updateUI('<div class="icon success">✅</div>', "ลงทะเบียนสำเร็จ!", "ยินดีต้อนรับ! ข้อมูลของคุณถูกบันทึกเรียบร้อยแล้ว", true);
    } else {
      updateUI('<div class="icon error">❌</div>', "เกิดข้อผิดพลาด", "เซิร์ฟเวอร์ตอบกลับมาว่า: " + resultText, true);
    }

  } catch (err) {
    updateUI('<div class="icon error">❌</div>', "ระบบขัดข้อง", "ไม่สามารถเชื่อมต่อได้: " + err.message, true);
  }
}

window.onload = function() {
  main();
};
</script>

</body>
</html>
